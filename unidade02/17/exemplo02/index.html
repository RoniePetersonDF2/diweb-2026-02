<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Exemplo 02</title>
</head>
<body>
    <div class="header">
        <h1>✔ Trabalhando com links externos com texto e imagem</h1>
    </div>
    <div class="content">
        <h2>Link externo atributo target <strong> _blank</strong></h2>
        <a href="https://supermario-game.com/pt"
            target="_blank"
            title="Jogo do super mário.">
            <img src="images/icons8-super-mario-100.png" alt="Imagem jogo super mário."> 
            <br>
            Jogue mário
        </a>
        <h2>Link externo sem atributo target</h2>
        <a href="https://etcdf.com.br/" 
            title="Acesse a página da Escola Técnica de Ceilândia - ETC">
            <img src="images/logo-etc.png" alt="Logo da Escola Técnica ETC" width="100">
            <br>
            Clique aqui
        </a>
    </div>
</body>
</html>
