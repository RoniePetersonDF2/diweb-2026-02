<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="image/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Aula 19 - Exemplo 01</title>
</head>
<body>
    <div class="header">
        <h1>🏠 Trabalhando com listas</h1>
    </div>

    <div class="content">
        <h2>♟️ Lista não ordenada</h2>
        
        <p>Criando uma lista não ordenada.</p>

        <ul>
            <li>🍞 Pão</li>
            <li>🥚 Ovo</li>
            <li>🥛 Leite</li>
        </ul>

        <hr>

        <h2>🔢 Lista ordenada</h2>

        <ol>
            <li>🍞 Pão</li>
            <li>🥚 Ovo</li>
            <li>🥛 Leite</li>
        </ol>

    </div>
</body>
</html>
