<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Aula 21 - Exercício 02</title>
</head>
<body>
    <main>
        <section class="side-left">
            <section class="content">
                <h1>Chico&<span>Dora</span></h1>
    
                <p>
                    Cuidando do seu amiguinho como parte da nossa família. <br>
                    Venha nossos produtos e serviços.
                </p>
                <img src="imagens/dog.png" alt="Logotipo de um cachorro.">
            </section>
        </section>
        <section class="side-right">
            <form action="">
                <div>
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" 
                        name="email" id="email"
                        placeholder="Informe o e-mail. Ex.: user@email.com"
                        required autofocus>
                </div>
                <div>
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" 
                        name="password" id="password"
                        placeholder="Informe o password."
                        required>
                </div>

                <div>
                    <input type="submit" value="Login" class="btn btn-primary">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
