<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Aula 21 - Exemplo 01</title>
</head>
<body>
    <h1>Trabalhando com a propriedade display</h1>
    
    <h2>
        Definindo a propriedade <span>display: </span>block
    </h2>

    <section class="container-01">
        <div class="box-01">
            Box 01
        </div>
        <div class="box-02">
            Box-02
        </div>
        <div class="box-03">
            Box-03
        </div>
    </section>

    <h2>
        Definindo a propriedade <span>display: </span>inline
    </h2>

    <section class="container-02">
        <span class="box-01">
            Box 01
        </span>
        <span class="box-02">
            Box-02
        </span>
        <span class="box-03">
            Box-03
        </span>
    </section>

</body>
</html>
